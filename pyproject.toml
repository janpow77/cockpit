[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cockpit"
version = "0.3.17"
description = "Multi-App-Multi-Host-Cockpit fuer Workshop, audit_designer, llm-router etc."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Jan Riener" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "starlette>=0.40",
    "sqlalchemy>=2.0",
    "paramiko>=3.5",
    "cryptography>=43",
    "pillow>=11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() im Default-Arg ist idiomatisch korrekt

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
